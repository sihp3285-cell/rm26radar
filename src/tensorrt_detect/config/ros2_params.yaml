# ROS2 统一参数文件
# 所有节点的参数集中在此管理，通过 launch 文件统一加载
# 修改后需重新 colcon build 使 install 目录同步

# ─────────────────────────────────────────────
# 图像源：video_node（视频文件模式）
# ─────────────────────────────────────────────
video_node:
  ros__parameters:
    video_path: "/home/delphine/rm/car_project/test/08.mp4"
    topic_name: "/image_raw"
    fps: 20
    synthetic_stamp: false

# ─────────────────────────────────────────────
# 图像源：camera_node（工业相机模式）
# ─────────────────────────────────────────────
camera_node:
  ros__parameters:
    # --- 相机选择 ---
    camera_brand: "hik"              # 品牌: "hik" (海康) 或 "daheng" (大恒)
    camera_sn: "DA7831910"           # 相机序列号（唯一标识）

    # --- 图像参数 ---
    auto_white_balance: true         # 自动白平衡
    exposure_time: 6000             # 曝光时间 (微秒)
    gain: 0.7                        # 增益 (0.0 ~ 1.0，相对最大增益的比例)
    gamma: 0.3                       # Gamma 值

    # --- 输出 ---
    topic_name: "/image_raw"         # 发布话题（与 video_node 保持一致）
    frame_id: "camera_frame"         # 坐标系标识

    # --- 内录 ---
    enable_recording: true          # 是否同时录制视频到本地
    record_path: "/home/delphine/rm/recording/"
    record_fps: 20.0                # 录制帧率 (1.0 ~ 240.0)
    record_bitrate_kbps: 15000      # 录制视频比特率 (kbps, 1000 ~ 200000)
    max_record_queue_size: 8        # 录制队列最大长度（过大导致内存暴涨）

detect_node:
  ros__parameters:
    config_dir: "/home/delphine/rm/tensorrt10_detect/configs"
    input_topic: "/image_raw"
    output_topic: "/detected_image"
    publish_debug_image: true
    # 确定性帧采样（配合 video_node.synthetic_stamp=true 使用）：
    #   每 frame_sampling_step 帧只处理 1 帧（如 2 -> 10Hz），
    #   处理帧序列由内容帧号决定，与 Qt/负载无关。默认关闭保持原行为。
    frame_sampling_enabled: false
    frame_sampling_step: 1
    frame_sampling_period_ms: 50
    debug_output_max_width: 1280

pose_node:
  ros__parameters:
    config_dir: "/home/delphine/rm/tensorrt10_detect/configs"
    input_topic: "/armor_detections"
    output_topic: "/world_targets"

    # 根据 pixel->world 局部雅可比，把检测框像素误差传播成方向相关的世界
    # 坐标协方差。远场视线方向会自动获得更大方差，不再被 Kalman 当成高速。
    projection_pixel_sigma_px: 4.0
    projection_finite_difference_px: 2.0
    projection_min_world_std_m: 0.03
    projection_max_world_std_m: 1.50

    # 中心差分射线的 PLY 命中高度差超过该值，视为沟底/坡面/高台首交点
    # 切换，并额外放大测量协方差。
    projection_surface_discontinuity_m: 0.12

    # V1 默认把 car/armor 作为两个完整 measurement hypotheses 分别评分并二选一；
    # false 时安全地优先选 armor（armor 缺失/失效则回退 car），不会隐式恢复插值。
    projection_selector_enabled: true
    projection_uncertainty_bad_std_m: 0.50
    projection_condition_bad: 30.0
    # 初始值并非理论最优，需要通过真实场地数据继续标定。
    projection_cost_uncertainty_weight: 1.0
    projection_cost_condition_weight: 0.4
    projection_cost_surface_weight: 1.7
    projection_cost_region_weight: 1.5

    # signed distance 位于 outer/inner 时，armor prior 分别约为 0.1/0.9。
    projection_region_outer_m: -1.5
    projection_region_inner_m: -0.4
    projection_switch_margin: 0.5
    projection_switch_confirm_frames: 5

    # canonical 沟区 polygon 只生成 soft region prior，不再直接生成插值权重。
    gully_region_path: "/home/delphine/rm/tensorrt10_detect/generated/gully.yaml"
    # 与 map_node.field_x_flip 保持一致。
    gully_field_x_flip: false

    # RViz2 纯旁路调试。launch 参数 rviz_debug_enabled 会覆盖总开关；false 时
    # PoseNode 不创建 Marker/TF publisher，也不复制本帧投影结果。
    rviz_debug_enabled: false
    rviz_debug_camera: true
    rviz_debug_fov: true
    rviz_debug_rays: true
    rviz_debug_ray_hits: true
    rviz_debug_measurements: true
    rviz_debug_world_frame: "world"
    rviz_debug_camera_frame: "camera_link"
    rviz_debug_static_topic: "/radar/rviz/static"
    rviz_debug_pose_topic: "/radar/rviz/pose"
    # 当前工业相机标定图像分辨率，仅用于绘制 FOV，不参与检测/投影。
    rviz_debug_image_width: 5472
    rviz_debug_image_height: 3648

    # ══════════════════════════════════════════════════════════════
    # Tracker 参数（由 config_dir/tracker.yaml 加载，此处仅为文档说明）
    # 实际修改请编辑 configs/tracker.yaml，重启 pose_node 生效
    # ══════════════════════════════════════════════════════════════
    # max_lost_time_s: 0.30          # 从最后真实观测起多久后 track 标记为 DEAD
    # max_predict_time_s: 0.20       # 丢失多久内保持 PREDICTED（卡尔曼外推）
    # dead_retention_time_s: 0.10    # DEAD 状态对下游的保留时间
    # dead_target_hold_time_s: 0.10  # 死亡装甲板直接测量的显示保持时间
    # min_hit: 3                     # 最少命中观测次数才允许对外输出 / 绑定 slot
    # max_tracks: 20                 # 最大同时跟踪的 PhysicalTrack 数量
    # max_gate_box: 1500.0           # 像素框中心距离门限
    # max_gate_world: 2.5            # 世界坐标 gate（米），<= 0 则禁用
    # kalman_gate_box: 18.467        # 4维 box 创新 NIS 门限（约 99.9%）
    # kalman_gate_world: 13.816      # 2维 world 创新 NIS 门限（约 99.9%）
    # negative_gate_box: 200.0       # 死亡负观测像素中心抑制距离
    # negative_gate_world: 1.0       # 死亡负观测世界坐标抑制距离（米）
    # w_box: 1.0                     # 像素框归一化距离权重
    # w_world: 1.0                   # 世界坐标归一化距离权重
    # class_mismatch_min_penalty: 0.05 # 跨兵种匹配的最低软惩罚
    # class_mismatch_penalty: 0.40   # 跨兵种匹配的最大软惩罚（随身份/检测可靠度动态插值）
    # min_identity_update_conf: 0.20 # 身份更新最低置信度
    # slot_bind_min_conf: 0.40       # 绑定 slot 最低 stable confidence
    # identity_confirm_observations: 3        # 新身份连续确认观测次数
    # identity_switch_confirm_observations: 8 # 身份切换连续确认观测次数
    # slot_lease_time_s: 0.30        # owner 不可输出后的槽位租约时间
    # max_slot_jump_dist: 2.5        # 防 slot 瞬移最大距离（米），<= 0 则禁用
    # # BotIdentity 身份稳定器子参数:
    # bot_identity.max_history: 30              # 历史有效观测最大保存次数
    # bot_identity.purge_after_lost_time_s: 1.0 # 连续丢失多久后清空历史
    # bot_identity.min_history_for_stable: 6    # 稳定身份最小观测次数门槛
    # bot_identity.decay: 0.99               # 指数加权衰减系数
    # bot_identity.num_classes: 9            # 类别总数

map_node:
  ros__parameters:
    config_dir: "/home/delphine/rm/tensorrt10_detect/configs"
    input_topic: "/world_targets"
    output_image_topic: "/map_image"
    output_map_topic: "/radar_map"
    prior_topic: "/prior_predictions"
    prior_display_timeout_s: 1.0

# 只读观察 /world_targets 和 /prior_predictions 的 RViz component。正常比赛
# launch 在 rviz_debug_enabled=false 时根本不会加载该 component。
rviz_debug_node:
  ros__parameters:
    rviz_debug_enabled: true
    world_targets_topic: "/world_targets"
    prior_predictions_topic: "/prior_predictions"
    world_frame: "world"
    static_topic: "/radar/rviz/static"
    tracker_topic: "/radar/rviz/tracker"
    guesser_topic: "/radar/rviz/guesser"

    mesh_path: "/home/delphine/rm/tensorrt10_detect/configs/RB2026_rmuc.ply"
    navgrid_path: "/home/delphine/rm/tensorrt10_detect/generated/RB2026_navgrid_v1.json"
    navgrid_role: "hero"
    blind_zone_paths:
      - "/home/delphine/rm/tensorrt10_detect/generated/home.yaml"
      - "/home/delphine/rm/tensorrt10_detect/generated/gully.yaml"
      - "/home/delphine/rm/tensorrt10_detect/generated/engineer.yaml"
    # 与 PositionPriorNode/MapNode 的启动视角一致；运行中订阅 /flip_team 更新。
    initial_flip_team: false

    mesh: true
    # 场地参考网格：替代 rviz2 自带的 Grid 显示（后者在本机部分会话里会
    # 静默不渲染，导致场地视觉上变成实心）
    # 显示开关已集中到文件底部 test_config 板块（rviz_field_grid 等）。
    tracks: true
    trajectories: true
    velocity: true
    covariance: true
    # 白色椭圆：最近一次被 Kalman 实际采用的测量噪声 R（原始测量位置处）
    measurement_covariance: true
    trajectory_length: 50
    velocity_scale_seconds: 1.0

qt_display_node:
  ros__parameters:
    video_topic: "/detected_image"
    map_image_topic: "/map_image"

calibrate_node:
  ros__parameters:
    config_dir: "/home/delphine/rm/tensorrt10_detect/configs"
    image_topic: "/image_raw"
    calib_result_path: "/home/delphine/rm/tensorrt10_detect/configs/calib_result.yaml"
    # 恢复修改前的标定标准：仅要求平均重投影误差 <= 10 px。
    # 0 表示最大单点误差只记录，不作为保存硬门限。
    reprojection_threshold: 10.0
    reprojection_max_threshold: 0.0
    auto_calibrate: true
    auto_calibrate_delay_sec: 2

roi_set_node:
  ros__parameters:
    config_dir: "/home/delphine/rm/tensorrt10_detect/configs"
    image_topic: "/image_raw"
    outpost_roi_path: "/home/delphine/rm/tensorrt10_detect/configs/outpost_roi.yaml"
    auto_set_roi: true
    auto_set_delay_sec: 3
# ═════════════════════════════════════════════════════════════════════════
# 🧪 测试调参板块（TEST BENCH）
# -------------------------------------------------------------------------
# 统一在这里开关/调节实验变量；修改后重启对应节点生效。
# 由各节点读取（参数名均带 test_config. 前缀）：
#   rviz_debug_node      读取 rviz_*（显示开关）
#   position_prior_node  读取 prior_*（猜点算法，需 launch 同时传入本文件）
#   pose_node            读取 pose_*/tracker_gate_mode（透传 posesolver/tracker）
# ═════════════════════════════════════════════════════════════════════════
test_config:
  ros__parameters:

    # ── 可视化（rviz_debug_node，仅显示，不影响算法）──────────────────
    rviz_nav_grid: true          # 仅可视化：是否绘制导航网格
    rviz_field_grid: true        # 仅可视化：是否绘制场地参考网格
    rviz_blind_zones: true       # 仅可视化：是否绘制盲区多边形
    rviz_guess_candidates: true  # 仅可视化：是否绘制猜点候选

    # ── 位置先验 / 猜点（position_prior_node）─────────────────────────
    # 注意：navgrid/盲区路径本体仍在 position_prior.yaml，这里只控制开关
    prior_navgrid_enabled: false  # 【核心逻辑】是否启用导航网格 Dijkstra 最短路径
                                 # （navigation_mesh.cpp）。false 时通用猜点距离
                                 # 退化为欧氏直线距离；navgrid 仍会加载供盲区先验
                                 # 使用（盲区候选按欧氏距离过滤），两者已解耦
    prior_enable_blind_zone: true   # 盲区先验（独立于 prior_navgrid_enabled；
                                    # navgrid 关闭时盲区候选按欧氏距离过滤）
    prior_enable_stay: true         # true=启用 stay probability 驻留锚点
                                    # false=stay_anchor_probability_scale 强制 0

    # ── 测量协方差（pose_node → posesolver）───────────────────────────
    pose_covariance_mode: "ray"     # "ray"  =多条差分射线/Jacobian 传播真实协方差(默认)
                                    # "fixed"=固定各向同性协方差(pose_fixed_world_std_m)
    pose_fixed_world_std_m: 0.50    # fixed 模式下的各向同性标准差 (m)

    # ── 跟踪门控（pose_node → tracker）────────────────────────────────
    tracker_gate_mode: "fixed"      # "fixed"   =固定卡方阈值(默认, kalman_gate_box/world)
                                    # "adaptive"=按每条轨迹创新一致性 EMA 自适应缩放阈值

