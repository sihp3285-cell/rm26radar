blind_zones:
  - name: enemy_blind_zone
    # 沟/中心遮挡在场地两侧中心对称；相机遮挡不是单边出生点先验。
    mirror_centrally: true
    # 2.5D navgrid 同一片区域含 0 m、0.2 m、0.3 m 等表面。车辆失踪后
    # 只沿最后观测所在道路层生成候选，避免跨层跳到相邻高台或低地。
    same_elevation_as_last: true
    max_height_delta_from_last_m: 0.08
    # 顶点3 沿角平分线外移 0.6 m：field(12.5,12.5)（web 显示 world(5.0,-1.50)）
    # 落在原边界外 0.31 m，仅靠容差覆盖；外移后该点真正进入多边形。
    polygon:
      - [12.9936, 13.8375]
      - [12.9936, 13.04]
      - [12.7773, 12.5076]
      - [9.2002, 8.3377]
      - [9.2004, 6.9151]
      - [10.4679, 3.9942]
      - [10.4689, 3.2781]
      - [10.1518, 2.8174]
      - [8.8335, 2.8164]
      - [8.6806, 3.5981]
      - [8.2283, 4.4998]
      - [7.1455, 6.5101]
      - [7.7228, 7.474]
      - [7.16, 8.4499]
      - [7.1561, 10.1287]
      - [7.7572, 10.1287]
      - [10.3546, 13.8344]