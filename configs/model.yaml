# DetectPipeline 的四个 TensorRT engine 与业务编排参数。
# 运行顺序是全图车辆(model1) -> 车辆 ROI 装甲板(model2) -> 兵种分类(model3)；
# airplane(model4) 可在后台线程处理右半图。所有 imgSize 都是 engine 输入边长。
modelPath: "/home/delphine/rm/tensorrt10_detect/models/robot_only.engine"
imgSize1: 1280
iouThreshold1: 0.3
scoreThreshold1: 0.3
isNMS1: false
modelType1: "DETECT"

armorModelPath: "/home/delphine/rm/tensorrt10_detect/models/newarmor.engine"
imgSize2: 192
iouThreshold2: 0.3
scoreThreshold2: 0.3
isNMS2: false
modelType2: "DETECT"

classifyModelPath: "/home/delphine/rm/tensorrt10_detect/models/classify_hku.engine"
imgSize3: 64
iouThreshold3: 0.3
scoreThreshold3: 0.3
isNMS3: false
modelType3: "CLASSIFY"

airplaneModelPath: "/home/delphine/rm/tensorrt10_detect/models/airplane640.engine"
imgSize4: 640
iouThreshold4: 0.3
scoreThreshold4: 0.3
isNMS4: false
modelType4: "DETECT"
airplane_interval_ms: 200

# 前哨站复用 armor engine 并在固定像素 ROI 内推理；其开关/ROI/阈值/地图点
# 统一由 configs/outpost_roi.yaml 提供（ConfigManager 与 /detect_node/reload_roi
# 都只读取该文件），本文件不再重复存放，避免“默认值被覆盖”的两层配置。

# 数值必须与 rm_field/robot_class.hpp（robot_id.hpp 的兼容来源）、分类 raw_id
# 映射和 ROS 消息保持一致。
classNames:
  0: "car"
  1: "armor"
  2: "1"   # 对应 raw_id 0
  3: "2"   # 对应 raw_id 1
  4: "3"   # 对应 raw_id 2
  5: "4"   # 对应 raw_id 3
  6: "s"   # 对应 raw_id 4
  7: "outpost"   # 前哨站
  8: "airplane"  # 无人机

minRoiSize: 30
padRatio: 0.25
classIdxBase: 2
# true 时把最多 max_armor_rois 个车辆 ROI 拼进同一 armor canvas，共用一次推理。
multi_car_recognition: false
armor_canvas_padding: 2
max_armor_rois: 4
