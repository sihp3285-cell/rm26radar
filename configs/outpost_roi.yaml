# 前哨站配置的唯一来源：ConfigManager 启动加载、ROISetNode 写入、
# DetectNode /detect_node/reload_roi 重载均读取本文件。
# outpost_roi=[x,y,width,height] 为原图像素；mappoints_* 是 MapNode 固定设施像素位置。
outpost_enabled: true
outpost_roi:
  - 2199
  - 1702
  - 78
  - 30
outpost_score_threshold: 0.1
outpost_miss_timeout_s: 1.5
outpost_mappoints_red:
  - 439
  - 92
outpost_mappoints_blue:
  - 280
  - 291
